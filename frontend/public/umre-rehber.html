<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umrebuldum — 3D İnteraktif Kutsal Topraklar Haritası</title>
    
    <!-- Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --primary: #0d7a3e;
            --primary-light: #15b05a;
            --gold: #c8a64e;
            --gold-light: #e0c273;
            --text-main: #f0f4f8;
            --text-muted: #8a9bb5;
            --bg-card: #0a1118;
            --bg-hover: #111d2b;
            --border: rgba(200, 166, 78, 0.3);
            --font-family: 'Inter', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            overflow: hidden;
            display: flex;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Sidebar overlay */
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            height: calc(100vh - 40px);
            background: rgba(10, 17, 24, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--gold); }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark);
            font-weight: 800;
            font-size: 20px;
        }

        .sidebar h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-track { background: transparent; }
        .sidebar-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .sidebar-content::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        .auto-tour-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(13, 122, 62, 0.4);
        }
        .auto-tour-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 122, 62, 0.6);
        }

        /* List Items - Yaşam Rehberi Style */
        .place-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .place-card:hover {
            background: var(--bg-hover);
            border-color: var(--gold);
            transform: translateX(4px);
            box-shadow: 0 4px 15px rgba(200, 166, 78, 0.15);
        }
        .place-card.active {
            border-color: var(--primary);
            background: rgba(13, 122, 62, 0.15);
        }
        
        .card-emoji {
            font-size: 26px;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-info h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 600;
            color: white;
        }
        .card-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        /* Custom Markers */
        .custom-marker {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(13, 122, 62, 0.8);
            position: relative;
        }
        .custom-marker::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--gold);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .marker-label {
            position: absolute;
            top: -34px;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .custom-marker:hover .marker-label {
            opacity: 1;
        }

        /* Popups */
        .mapboxgl-popup {
            z-index: 20;
            max-width: 400px !important;
        }
        .mapboxgl-popup-content {
            background: var(--bg-card);
            color: var(--text-main);
            border-radius: 16px;
            padding: 0;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            animation: popup-fade-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .mapboxgl-popup-tip {
            border-top-color: var(--bg-card) !important;
            border-bottom-color: var(--bg-card) !important;
        }
        .mapboxgl-popup-close-button {
            color: white;
            font-size: 24px;
            right: 12px;
            top: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            transition: background 0.2s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .mapboxgl-popup-close-button:hover { background: rgba(0,0,0,0.8); }

        @keyframes popup-fade-up {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .popup-header-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid var(--gold);
            display: block;
        }

        .popup-body {
            padding: 24px;
        }

        .popup-title {
            font-size: 20px;
            margin: 0 0 8px 0;
            color: white;
            font-weight: 700;
        }
        .popup-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        /* Tabs inside Popup */
        .tabs-container {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px 12px 4px;
            flex: 1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .tab-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        .tab-btn:hover:not(.active) {
            color: white;
        }
        .tab-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .tab-content {
            display: none;
            font-size: 14px;
            line-height: 1.6;
            color: #d0d8e0;
            animation: slide-up 0.4s ease forwards;
            min-height: 80px;
            opacity: 0;
        }
        .tab-content.active { display: block; opacity: 1; }
        .tab-content strong { color: var(--gold-light); font-weight: 600; }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Map Controls Fix */
        .mapboxgl-ctrl-group {
            background-color: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4) !important;
        }
        .mapboxgl-ctrl-group button {
            border-bottom-color: var(--border) !important;
        }
        .mapboxgl-ctrl-icon.mapboxgl-ctrl-zoom-in { filter: invert(1); }
        .mapboxgl-ctrl-icon.mapboxgl-ctrl-zoom-out { filter: invert(1); }
        .mapboxgl-ctrl-icon.mapboxgl-ctrl-compass { filter: invert(1); }
        .mapboxgl-ctrl-bottom-right { bottom: 20px !important; right: 20px !important; }

    </style>
</head>

        // Ensure Map matches premium true black theme and initializes as a globe
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11', // Mapbox core dark theme
            projection: 'globe', // Initialize as 3D Globe
            zoom: 1.5,
            center: [39.8262, 21.4225],
            pitch: 20,
            bearing: 0
        });

        // Map UI Controls
        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

        // Add 3D elements and atmosphere
        map.on('style.load', () => {
            // Customize Fog (Globe Atmosphere) for premium look
            map.setFog({
                'color': 'rgb(0, 0, 0)',
                'high-color': '#0d7a3e', // Primary green horizon blending
                'horizon-blend': 0.05,
                'space-color': 'rgb(0, 0, 0)', // Black background
                'star-intensity': 0.5
            });

            // Add 3D Extruded Buildings (Generic Layer provided by Mapbox)
            if (map.getSource('composite') && map.getLayer('building')) {
                map.addLayer(
                    {
                        'id': '3d-buildings',
                        'source': 'composite',
                        'source-layer': 'building',
                        'filter': ['==', 'extrude', 'true'],
                        'type': 'fill-extrusion',
                        'minzoom': 15,
                        'paint': {
                            // Green tint for all buildings giving a premium night look,
                            // Gold highlight if hovered
                            'fill-extrusion-color': [
                                'case',
                                ['boolean', ['feature-state', 'hover'], false],
                                '#c8a64e',  // Gold
                                '#095c2e'   // Dark primary green
                            ],
                            'fill-extrusion-height': [
                                'interpolate', ['linear'], ['zoom'],
                                15, 0,
                                15.05, ['get', 'height']
                            ],
                            'fill-extrusion-base': [
                                'interpolate', ['linear'], ['zoom'],
                                15, 0,
                                15.05, ['get', 'min_height']
                            ],
                            'fill-extrusion-opacity': 0.6
                        }
                    },
                    'waterway-label' // Ensure labels appear correctly on top of buildings
                );
            }
        });

        // ----------------
        // Interaction Logic
        // ----------------

        let userInteracting = false;
        let spinEnabled = true;

        map.on('mousedown', () => { userInteracting = true; });
        map.on('mouseup', () => { userInteracting = false; spinGlobe(); });
        map.on('dragstart', () => { userInteracting = true; });
        map.on('dragend', () => { userInteracting = false; spinGlobe(); });
        map.on('zoomstart', () => { userInteracting = true; });
        map.on('zoomend', () => { userInteracting = false; spinGlobe(); });
        
        function spinGlobe() {
            const zoom = map.getZoom();
            // Start spinning slowly if zoomed out and no user interaction
            if (spinEnabled && !userInteracting && zoom < 4) {
                let e = map.getCenter();
                e.lng += 0.3; // Spin Speed
                map.easeTo({ center: e, easing: n => n, duration: 1000 });
            }
        }
        map.on('moveend', () => { spinGlobe(); });
        spinGlobe(); // Initiate immediately

        // Storage mappings
        const markers = {};
        
        // Populate DOM elements and Map Points
        places.forEach(place => {
            // Pulse Marker Element
            const el = document.createElement('div');
            el.className = 'custom-marker';
            el.innerHTML = place.emoji;
            
            const label = document.createElement('div');
            label.className = 'marker-label';
            label.innerText = place.name;
            el.appendChild(label);

            // Popups Content (Tabs and Data structured)
            // Note logic below implements elegant layout and dynamic tabs
            const popupContent = `
                <div class="popup-wrapper">
                    <!-- Popup Header image mapping dynamic source with rounded corners via CSS -->
                    <img src="${place.imageURL}" alt="${place.name}" class="popup-header-img" onerror="this.src='/stock/kabe-1.png'">
                    <div class="popup-body">
                        <h2 class="popup-title">${place.name}</h2>
                        <p class="popup-desc">${place.desc}</p>
                        
                        <!-- Rich Tab Buttons -->
                        <div class="tabs-container">
                            <button class="tab-btn active" onclick="switchPopupTab(this, 'siyer', '${place.id}')">
                                <svg class="tab-icon"><use href="#icon-siyer"></use></svg> Siyer
                            </button>
                            <button class="tab-btn" onclick="switchPopupTab(this, 'nuzul', '${place.id}')">
                                <svg class="tab-icon"><use href="#icon-nuzul"></use></svg> Nüzul
                            </button>
                            <button class="tab-btn" onclick="switchPopupTab(this, 'ziyaret', '${place.id}')">
                                <svg class="tab-icon"><use href="#icon-ziyaret"></use></svg> Ziyaret
                            </button>
                            <button class="tab-btn" onclick="switchPopupTab(this, 'yasam', '${place.id}')">
                                <svg class="tab-icon"><use href="#icon-yasam"></use></svg> Yaşam
                            </button>
                        </div>

                        <!-- Full-Text Tab Contents -->
                        <div id="tab-siyer-${place.id}" class="tab-content active">${place.tabs.siyer}</div>
                        <div id="tab-nuzul-${place.id}" class="tab-content">${place.tabs.nuzul}</div>
                        <div id="tab-ziyaret-${place.id}" class="tab-content">${place.tabs.ziyaret}</div>
                        <div id="tab-yasam-${place.id}" class="tab-content">${place.tabs.yasam}</div>
                    </div>
                </div>
            `;

            // Setup mapbox popup
            const popup = new mapboxgl.Popup({ offset: 20, closeButton: true, closeOnClick: false })
                .setHTML(popupContent);

            // Setup mapbox marker
            const marker = new mapboxgl.Marker(el)
                .setLngLat([place.lng, place.lat])
                .setPopup(popup)
                .addTo(map);

            markers[place.id] = { marker, popup };

            // Render Sidebar Cards
            const sidebarHtml = `
                <div class="place-card" id="card-${place.id}" onclick="flyToPlace('${place.id}')">
                    <div class="card-emoji">${place.emoji}</div>
                    <div class="card-info">
                        <h3>${place.name}</h3>
                        <p>${place.desc}</p>
                    </div>
                </div>
            `;
            document.getElementById('places-list').insertAdjacentHTML('beforeend', sidebarHtml);
            
            // Re-highlight active class when clicking directly on map markers
            popup.on('open', () => {
                document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
                const cardNode = document.getElementById(`card-${place.id}`);
                if (cardNode) {
                    cardNode.classList.add('active');
                    cardNode.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        });

        // ----------------
        // Action Helpers
        // ----------------

        // Fly navigation to city levels
        function flyToPlace(id) {
            spinEnabled = false; 
            const place = places.find(p => p.id === id);
            
            // Animate Map Target
            map.flyTo({
                center: [place.lng, place.lat],
                zoom: place.zoom,
                pitch: place.pitch,
                bearing: place.bearing,
                duration: 4000,
                essential: true
            });

            // Cleanup & Reset All currently open Popups
            Object.values(markers).forEach(m => {
                if(m.popup.isOpen()){
                    m.popup.remove();
                }
            });
            
            // Reopen after flight travel (Duration = 4000 ms)
            setTimeout(() => {
                markers[id].marker.togglePopup();
            }, 4200);
            
            // Sidebar Active UI
            document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
            let activeCard = document.getElementById(`card-${id}`);
            if (activeCard) {
                activeCard.classList.add('active');
            }
        }

        // Global function for popup HTML elements
        window.switchPopupTab = function(btn, tabName, id) {
            const container = btn.closest('.popup-body');
            
            // Remove active visually from previous
            container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            container.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // Grant active to new selection
            btn.classList.add('active');
            const newContent = container.querySelector(`#tab-${tabName}-${id}`);
            if (newContent) {
                // Apply animation reflow
                newContent.classList.remove('active');
                void newContent.offsetWidth; // Force Reflow
                newContent.classList.add('active');
            }
        };

        // ----------------
        // Auto Tour Logic
        // ----------------
        let tourIndex = 0;
        let isTouring = false;
        let tourTimeout;

        const tourBtn = document.getElementById('start-tour-btn');
        tourBtn.addEventListener('click', () => {
            if (isTouring) {
                stopAutoTour();
            } else {
                startAutoTour();
            }
        });

        function startAutoTour() {
            isTouring = true;
            // Transforming UI to Stop Button
            tourBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg> Turu Durdur`;
            tourBtn.style.background = 'linear-gradient(135deg, #a61c1c, #da2a2a)';
            tourIndex = 0;
            processTourStep();
        }

        function stopAutoTour() {
            isTouring = false;
            clearTimeout(tourTimeout);
            // Revert UI to Start
            tourBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 3l14 9-14 9V3z"/>
                </svg> Manevi Yolculuğu Başlat`;
            tourBtn.style.background = 'linear-gradient(135deg, var(--primary), var(--primary-light))';
        }

        function processTourStep() {
            if (!isTouring) return;
            // Boundary Condition End
            if (tourIndex >= places.length) {
                stopAutoTour();
                // Reset map to globe
                spinEnabled = true;
                map.flyTo({
                    zoom: 1.5,
                    pitch: 20,
                    bearing: 0,
                    duration: 3000
                });
                return;
            }
            
            const p = places[tourIndex];
            flyToPlace(p.id);
            
            // Total Wait Per Place -> 4.2s Fly time + ~15 Sec Presentation
            tourTimeout = setTimeout(() => {
                tourIndex++;
                processTourStep();
            }, 19000);
        }

    </script>
