<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UmreBuldum - İnteraktif Harita</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP Core (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-transparent text-slate-800 overflow-hidden h-screen w-screen relative font-sans">
    
    <!-- Header / Nav -->
    <div class="absolute top-6 left-6 z-[60] flex items-center gap-4">
        <button id="btn-back" class="hidden bg-white/80 hover:bg-white backdrop-blur-xl border border-slate-200 text-slate-800 px-5 py-2.5 rounded-full shadow-lg transition-all flex items-center gap-2 text-sm md:text-base font-medium cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Ana Haritaya Dön
        </button>
    </div>

    <!-- Map Container -->
    <main class="map-viewport bg-transparent">
        <!-- JS will dynamically set width/height based on aspect ratio -->
        <div id="map-wrapper" class="map-wrapper transition-opacity duration-500 relative">
            
            <!-- Background Image -->
            <img id="map-background" src="" alt="Interactive Map" class="select-none pointer-events-none" />
            
            <!-- Pins container (Exactly matches wrapper/img size) -->
            <div id="pins-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>
            
            <!-- Loading Overlay -->
            <div id="map-loader" class="absolute inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50">
                <div class="animate-spin rounded-full h-14 w-14 border-b-2 border-emerald-500"></div>
            </div>
        </div>
    </main>

    <!-- Premium Info Side Panel (Desktop) / Bottom Sheet (Mobile) -->
    <div id="info-modal" class="fixed inset-0 z-[100] flex justify-end items-end md:items-stretch pointer-events-none opacity-0 transition-opacity duration-300 ease-out">
        <!-- Backdrop with blur -->
        <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/30 backdrop-blur-[4px] pointer-events-none transition-opacity duration-300"></div>
        
        <!-- Modal Content Container -->
        <div id="modal-content" class="bg-white w-full md:w-[420px] md:h-full md:rounded-l-3xl rounded-t-3xl p-6 md:p-8 shadow-2xl pointer-events-auto transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.19,1,0.22,1)] relative z-10 flex flex-col max-h-[85vh] md:max-h-full">
            
            <!-- Drag Handle (Mobile only) -->
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 md:hidden"></div>
            
            <button id="btn-close-modal" class="absolute top-5 right-5 md:top-6 md:right-6 p-2 bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-full transition-colors z-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <!-- Scrollable Content Area -->
            <div class="overflow-y-auto flex-1 mt-2 md:mt-12 pr-2 custom-scrollbar">
                <div id="modal-body" class="w-full">
                    <!-- Rich HTML Content Injected Here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
